name: AST Scan Orchestrator

# Dispatched by the Conviso Platform. Serves two cases with one workflow:
#   - post-merge scan   (commit_sha / pr_number are set)
#   - on-demand "Run AST" from the platform UI (they are empty)
#
# Only one secret is needed: CONVISO_API_KEY. The credential used to clone the
# target repository is issued by the platform at run time, scoped to that single
# repository with read-only access, and expires in about an hour.
#
# One Actions variable is also required: CONVISO_COMPANY_ID. Post-merge dispatches
# carry no company id, and this project always serves a single integration — which
# belongs to a single company — so the id is a constant here. See the "Run Conviso
# AST" step.
on:
  workflow_dispatch:
    inputs:
      repo_full_name:
        description: 'Repository to scan (owner/repo)'
        required: true
        type: string
      branch:
        description: 'Branch to scan'
        required: true
        type: string
      api_url:
        description: 'Conviso Platform URL'
        required: false
        type: string
      company_id:
        description: 'Conviso company id. When empty the CONVISO_COMPANY_ID variable is used'
        required: false
        type: string
      asset_id:
        description: 'Conviso asset id. When empty the scanner resolves the asset by repository name'
        required: false
        type: string
      scan_run_id:
        description: 'Scan run created by the platform. Correlates this execution with the run shown in the UI'
        required: false
        type: string
      commit_sha:
        description: 'Merge commit SHA (post-merge scans only)'
        required: false
        type: string
      pr_number:
        description: 'Pull request number (post-merge scans only)'
        required: false
        type: string

jobs:
  run-ast-scan:
    runs-on: ubuntu-latest
    container:
      image: luherique/convisoast_v2:scanrun-dev

    steps:
      # The job's own GITHUB_TOKEN only reaches THIS repository, so it cannot clone
      # the one being scanned. The platform issues that credential per run, from the
      # API key this project already holds — no personal access token to store.
      - name: Get repository token
        id: repo_token
        env:
          # Secret name vs variable name: the scanner reads CONVISO_APIKEY, while
          # the repository secret keeps the CONVISO_API_KEY name it always had.
          CONVISO_APIKEY: ${{ secrets.CONVISO_API_KEY }}
          CONVISO_BASE_URL: ${{ inputs.api_url || 'https://app.convisoappsec.com' }}
          CONVISO_REPO_FULL_NAME: ${{ inputs.repo_full_name }}
          CONVISO_ASSET_ID: ${{ inputs.asset_id }}
          CONVISO_SCAN_RUN_ID: ${{ inputs.scan_run_id }}
        run: |
          TOKEN=$(conviso-ast-repository-token --provider github)
          # Mask BEFORE the value reaches the step output, so it can never surface
          # in this job's log.
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Checkout target repository
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repo_full_name }}
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          token: ${{ steps.repo_token.outputs.token }}

      - name: Run Conviso AST
        env:
          CONVISO_APIKEY: ${{ secrets.CONVISO_API_KEY }}
          CONVISO_BASE_URL: ${{ inputs.api_url || 'https://app.convisoappsec.com' }}
          # Post-merge dispatches carry no company id, so fall back to the variable
          # configured on this project. The dispatched value still wins when the
          # platform sends one, which keeps a single orchestrator correct even if it
          # ever serves more than one company.
          CONVISO_COMPANY_ID: ${{ inputs.company_id || vars.CONVISO_COMPANY_ID }}
          CONVISO_ASSET_ID: ${{ inputs.asset_id }}
          CONVISO_SCAN_RUN_ID: ${{ inputs.scan_run_id }}
          CONVISO_BRANCH: ${{ inputs.branch }}
          # The job container runs as root while the checked-out files belong to
          # the runner's user, so git refuses the workspace with "detected dubious
          # ownership". Semgrep shells out to `git status` and osv-scanner reads
          # .gitignore, so both come back EMPTY instead of failing — a scan that
          # reports zero findings while having scanned nothing.
          #
          # Set through GIT_CONFIG_* rather than `git config --global` because a
          # container job overrides HOME (/github/home), which hides any gitconfig
          # written elsewhere. These are read regardless of HOME.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: '*'
        run: |
          # The scanner requires a company id, but its own check only rejects an
          # UNSET variable. An empty string slips past that check and fails much
          # later with an opaque API error. Fail here, where the cause is readable.
          if [ -z "$CONVISO_COMPANY_ID" ]; then
            echo "::error::No company id. Add a repository variable named CONVISO_COMPANY_ID with your Conviso company id (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          conviso-ast -p . -o /tmp/conviso-ast-session.zip

      - name: Upload session log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conviso-ast-session
          path: /tmp/conviso-ast-session.zip
          if-no-files-found: ignore
