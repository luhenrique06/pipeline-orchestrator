name: AST Scan Orchestrator

# Dispatched by the Conviso Platform. Serves two cases with one workflow:
#   - post-merge scan   (commit_sha / pr_number are set)
#   - on-demand "Run AST" from the platform UI (they are empty)
#
# Only one secret is needed: CONVISO_APIKEY. The credential used to clone the
# target repository is issued by the platform at run time, scoped to that single
# repository with read-only access, and expires in about an hour.
on:
  workflow_dispatch:
    inputs:
      repo_full_name:
        description: 'Repository to scan (owner/repo)'
        required: true
        type: string
      branch:
        description: 'Branch to scan'
        required: true
        type: string
      api_url:
        description: 'Conviso Platform URL'
        required: false
        type: string
      company_id:
        description: 'Conviso company id'
        required: false
        type: string
      asset_id:
        description: 'Conviso asset id. When empty the scanner resolves the asset by repository name'
        required: false
        type: string
      scan_run_id:
        description: 'Scan run created by the platform. Correlates this execution with the run shown in the UI'
        required: false
        type: string
      commit_sha:
        description: 'Merge commit SHA (post-merge scans only)'
        required: false
        type: string
      pr_number:
        description: 'Pull request number (post-merge scans only)'
        required: false
        type: string

jobs:
  run-ast-scan:
    runs-on: ubuntu-latest
    container:
      image: convisoappsec/convisoast_v2:latest

    steps:
      # Written in Python because every step runs inside the scanner image, which
      # ships git and python3 but no curl and no jq.
      - name: Get repository token
        id: repo_token
        env:
          CONVISO_APIKEY: ${{ secrets.CONVISO_APIKEY }}
          API_URL: ${{ inputs.api_url || 'https://app.convisoappsec.com' }}
          REPO_FULL_NAME: ${{ inputs.repo_full_name }}
          ASSET_ID: ${{ inputs.asset_id }}
          SCAN_RUN_ID: ${{ inputs.scan_run_id }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.error, urllib.request

          api_url = os.environ["API_URL"].rstrip("/")
          api_key = os.environ.get("CONVISO_APIKEY", "")
          if not api_key:
              sys.exit("CONVISO_APIKEY is not set. Add it as a secret in this repository.")

          payload = {"repo_full_name": os.environ["REPO_FULL_NAME"]}
          for field, var in (("asset_id", "ASSET_ID"), ("scan_run_id", "SCAN_RUN_ID")):
              if os.environ.get(var):
                  payload[field] = os.environ[var]

          req = urllib.request.Request(
              f"{api_url}/api/v2/github/repository_token",
              data=json.dumps(payload).encode(),
              method="POST",
              headers={"Content-Type": "application/json", "x-api-key": api_key},
          )

          try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                  body = json.loads(resp.read().decode())
          except urllib.error.HTTPError as err:
              detail = err.read().decode()
              sys.exit(
                  f"Conviso Platform refused to issue a repository token (HTTP {err.code}): {detail}\n"
                  "Check that this repository is imported as an asset of the company owning CONVISO_APIKEY."
              )
          except Exception as err:
              sys.exit(f"Could not reach the Conviso Platform at {api_url}: {err}")

          token = body.get("token")
          if not token:
              sys.exit("Conviso Platform returned no token.")

          # Mask BEFORE the value reaches the step output, so it can never surface
          # in this job's log.
          print(f"::add-mask::{token}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"token={token}\n")
          PYEOF

      - name: Checkout target repository
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repo_full_name }}
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          token: ${{ steps.repo_token.outputs.token }}

      - name: Run Conviso AST
        env:
          CONVISO_APIKEY: ${{ secrets.CONVISO_APIKEY }}
          CONVISO_BASE_URL: ${{ inputs.api_url || 'https://app.convisoappsec.com' }}
          CONVISO_COMPANY_ID: ${{ inputs.company_id }}
          CONVISO_ASSET_ID: ${{ inputs.asset_id }}
          CONVISO_SCAN_RUN_ID: ${{ inputs.scan_run_id }}
          CONVISO_BRANCH: ${{ inputs.branch }}
        run: |
          conviso-ast -p . -o /tmp/conviso-ast-session.zip

      - name: Upload session log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conviso-ast-session
          path: /tmp/conviso-ast-session.zip
          if-no-files-found: ignore
