name: AST Scan Orchestrator

# Dispatched by the Conviso Platform. Serves two cases with one workflow:
#   - post-merge scan   (commit_sha / pr_number are set)
#   - on-demand "Run AST" from the platform UI (they are empty)
on:
  workflow_dispatch:
    inputs:
      repo_full_name:
        description: 'Repository to scan (owner/repo)'
        required: true
        type: string
      branch:
        description: 'Branch to scan'
        required: true
        type: string
      api_url:
        description: 'Conviso Platform URL'
        required: false
        type: string
      company_id:
        description: 'Conviso company id'
        required: false
        type: string
      asset_id:
        description: 'Conviso asset id. When empty the scanner resolves the asset by repository name'
        required: false
        type: string
      scan_run_id:
        description: 'Scan run created by the platform. Correlates this execution with the run shown in the UI'
        required: false
        type: string
      commit_sha:
        description: 'Merge commit SHA (post-merge scans only)'
        required: false
        type: string
      pr_number:
        description: 'Pull request number (post-merge scans only)'
        required: false
        type: string

jobs:
  run-ast-scan:
    runs-on: ubuntu-latest
    container:
      image: convisoappsec/convisoast_v2:latest

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repo_full_name }}
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          # The default GITHUB_TOKEN is scoped to THIS repository, so it cannot
          # clone the target repo. CONVISO_REPO_TOKEN must be a PAT or GitHub App
          # token with read access to every repository you scan.
          token: ${{ secrets.CONVISO_REPO_TOKEN }}

      - name: Run Conviso AST
        env:
          CONVISO_APIKEY: ${{ secrets.CONVISO_APIKEY }}
          CONVISO_BASE_URL: ${{ inputs.api_url || 'https://app.convisoappsec.com' }}
          CONVISO_COMPANY_ID: ${{ inputs.company_id }}
          CONVISO_ASSET_ID: ${{ inputs.asset_id }}
          CONVISO_SCAN_RUN_ID: ${{ inputs.scan_run_id }}
          CONVISO_BRANCH: ${{ inputs.branch }}
        run: |
          conviso-ast -p . -o /tmp/conviso-ast-session.zip

      - name: Upload session log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conviso-ast-session
          path: /tmp/conviso-ast-session.zip
          if-no-files-found: ignore
